name: Calculus Animator CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# A newer push to the same branch/PR cancels the in-flight run instead of
# queueing behind it — faster feedback, fewer wasted runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Python correctness lint ──────────────────────────────────────
  # Gated on the F (pyflakes/correctness) family across the whole repo.
  # tools/ and slide_renderer/ carry pre-existing E/W style and ANN/BLE
  # advisory debt tracked separately, off the OSS POC critical path.
  ruff:
    name: Ruff (Python lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install Ruff
        run: pip install ruff==0.13.3
      # --output-format=github surfaces each violation as an inline
      # annotation on the PR "Files changed" tab, not just in the log.
      - name: Lint (correctness — F rules)
        run: ruff check . --select F --output-format=github

  # ── JS lint ──────────────────────────────────────────────────────
  # ESLint flat config lints the vanilla-JS UI under ui/js/. ui/vendor/
  # (KaTeX/MathLive) and ai_tutor/tutor-panel.js are excluded. Gated on
  # errors only; advisory warnings are printed but do not fail the build.
  eslint:
    name: ESLint (JS lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      # `npm ci` installs the exact lockfile graph and fails if it is out
      # of sync with package.json — reproducible eslint across runs.
      - name: Install JS lint dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint JS with ESLint
        run: npm run lint

  # ── Type check ───────────────────────────────────────────────────
  # Gated on api + core + ai_tutor (the actively maintained packages).
  # tools/ and slide_renderer/ have pre-existing typing debt deferred to
  # a future broader cleanup.
  mypy:
    name: Mypy (type check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: Type check with Mypy
        run: mypy api core ai_tutor

  # ── Unit / integration tests ─────────────────────────────────────
  # Everything except GUI (needs a display buffer) and E2E (needs a
  # browser). No Playwright download here, so this reports fast.
  tests-unit:
    name: Pytest (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      # -v names every test as it runs; --tb=short keeps failure
      # tracebacks readable; --durations flags the slowest tests.
      - name: Run unit tests
        run: pytest -m "not gui and not e2e" -v --tb=short --durations=10

  # ── End-to-end tests ─────────────────────────────────────────────
  # The E2E UI smoke test launches headless chromium; its browser binary
  # must be downloaded separately from the pip client lib. Isolated here
  # so its setup cost never blocks the unit-test feedback loop.
  tests-e2e:
    name: Pytest (E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium
      - name: Run E2E tests
        run: pytest -m "e2e" -v --tb=short
